server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    # ไฟล์ที่ Vite ใส่ hash ในชื่อ (assets/index-a1b2c3d4.js) เปลี่ยนชื่อทุกครั้งที่ build
    # จึง cache ยาวได้ปลอดภัย
    # (ห้ามใส่ `expires` คู่กับ add_header ตัวนี้ — nginx จะออก Cache-Control สองค่าต่อกัน)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html ห้าม cache — ไม่งั้น deploy ใหม่แล้วผู้ใช้ยังโหลดหน้าเก่า
    # ที่ชี้ไปไฟล์ hash เดิมซึ่งไม่มีอยู่แล้ว
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # App.jsx ใช้ BrowserRouter — path ที่ไม่ใช่ไฟล์จริงต้องคืน index.html
    # ให้ react-router จัดการเอง (ไม่มีบรรทัดนี้ = refresh กลางแอปได้ 404)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
